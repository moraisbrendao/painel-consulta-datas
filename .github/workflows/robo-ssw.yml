# Robô da conferência SSW: lê a previsão da transportadora no rastreio público do SSW.
name: Robô do SSW

on:
  schedule:
    - cron: "0 9,15 * * 1-5"   # 6h e 12h (Brasília), dias úteis
  workflow_dispatch:
    inputs:
      modo:
        description: "real = consulta os pedidos em aberto e grava a previsão SSW · diag = só olhar"
        type: choice
        options: [real, diag, diag-form, diag-nf, diag-nf2, diag-st, diag-link]
        default: real
      limite:
        description: "Teste: consultar só os N primeiros pedidos (vazio = todos)"
        type: string
        default: ""

concurrency:
  group: robo-ssw
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rodar o robô
        run: node robo/robo-ssw.mjs
        env:
          MODO: ${{ github.event.inputs.modo || 'real' }}
          SSW_LIMITE: ${{ github.event.inputs.limite || '' }}
          ROBO_EMAIL: ${{ secrets.ROBO_EMAIL }}
          ROBO_SENHA: ${{ secrets.ROBO_SENHA }}
