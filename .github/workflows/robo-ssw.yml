# Robô da conferência SSW: lê a previsão da transportadora no rastreio público do SSW.
name: Robô do SSW

on:
  schedule:
    - cron: "0 9-23/2 * * 1-5"   # de 2 em 2 horas, das 6h às 20h (Brasília), dias úteis
  workflow_dispatch:
    inputs:
      modo:
        description: "real = consulta os pedidos em aberto e grava a previsão SSW · diag = só olhar"
        type: choice
        options: [real, conferencia, diag, diag-form, diag-nf, diag-nf2, diag-st, diag-link, diag-det, diag-api, diag-ent, diag-senha, diag-ajuda, diag-jadlog]
        default: real
      paralelo:
        description: "Consultas ao mesmo tempo (padrão 5)"
        type: string
        default: ""
      pausa:
        description: "Pausa entre consultas em ms (padrão 2500)"
        type: string
        default: ""
      limite:
        description: "Teste: consultar só os N primeiros pedidos (vazio = todos)"
        type: string
        default: ""

concurrency:
  group: robo-ssw-${{ startsWith(github.event.inputs.modo || 'real', 'diag') && github.event.inputs.modo || 'consulta' }}   # real e conferência nunca ao mesmo tempo (respeita o limite do SSW)
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # para a conferência continuar sozinha na rodada seguinte

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rodar o robô
        run: node robo/robo-ssw.mjs
        env:
          MODO: ${{ github.event.inputs.modo || 'real' }}
          SSW_LIMITE: ${{ github.event.inputs.limite || '' }}
          SSW_PARALELO: ${{ github.event.inputs.paralelo || '' }}
          SSW_PAUSA: ${{ github.event.inputs.pausa || '' }}
          ROBO_EMAIL: ${{ secrets.ROBO_EMAIL }}
          ROBO_SENHA: ${{ secrets.ROBO_SENHA }}
          DOMINALOG_DOMINIO: ${{ secrets.DOMINALOG_DOMINIO }}
          DOMINALOG_USUARIO: ${{ secrets.DOMINALOG_USUARIO }}
          DOMINALOG_SENHA: ${{ secrets.DOMINALOG_SENHA }}
          DOMINALOG_CNPJ: ${{ secrets.DOMINALOG_CNPJ }}
          SSW_SENHA_TRANSSUA: ${{ secrets.SSW_SENHA_TRANSSUA }}
          SSW_SENHA_VM: ${{ secrets.SSW_SENHA_VM }}
          SSW_SENHA_ACEVILLE: ${{ secrets.SSW_SENHA_ACEVILLE }}
          JADLOG_TOKEN: ${{ secrets.JADLOG_TOKEN || secrets.TOKEN }}
          JADLOG_USUARIO: ${{ secrets.JADLOG_USUARIO || secrets.USUARIO_JADLOG }}
          JADLOG_CODIGO: ${{ secrets.JADLOG_CODIGO_CLIENTE || secrets.CODIGO_CLIENTE_JADLOG }}
      - name: Continuar a conferência (se ainda falta)
        if: ${{ hashFiles('continuar') != '' }}
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/robo-ssw.yml/dispatches" -d '{"ref":"main","inputs":{"modo":"conferencia"}}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
