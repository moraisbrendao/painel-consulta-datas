# Robô da conferência SSW: lê a previsão da transportadora no rastreio público do SSW.
name: Robô do SSW

on:
  schedule:
    - cron: "0 9-23/2 * * 1-5"   # de 2 em 2 horas, das 6h às 20h (Brasília), dias úteis
  workflow_dispatch:
    inputs:
      modo:
        description: "real = consulta os pedidos em aberto e grava a previsão SSW · diag = só olhar"
        type: choice
        options: [real, conferencia, conferencia-tudo, aguardando, aguardando-teste, jadlog, transito-cte, transportadora, diag, diag-form, diag-nf, diag-nf2, diag-st, diag-link, diag-det, diag-api, diag-ent, diag-senha, diag-ajuda, diag-jadlog, diag-bento, diag-transito, diag-transiga, diag-track3r, diag-form1, diag-emissor, diag-senior-js]
        default: real
      paralelo:
        description: "Consultas ao mesmo tempo (padrão 5)"
        type: string
        default: ""
      pausa:
        description: "Pausa entre consultas em ms (padrão 2500)"
        type: string
        default: ""
      transp:
        description: "Modo transportadora: nome (ou parte) da transportadora para conferir de novo"
        type: string
        default: ""
      limite:
        description: "Teste: consultar só os N primeiros pedidos (vazio = todos)"
        type: string
        default: ""

concurrency:
  group: robo-ssw-${{ (startsWith(github.event.inputs.modo || 'real', 'diag') || github.event.inputs.modo == 'jadlog' || github.event.inputs.modo == 'transito-cte' || github.event.inputs.modo == 'transportadora' || startsWith(github.event.inputs.modo || '', 'aguardando') || github.event.inputs.modo == 'conferencia-tudo') && github.event.inputs.modo || 'consulta' }}   # real e conferência nunca ao mesmo tempo (respeita o limite do SSW)
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # para a conferência continuar sozinha na rodada seguinte

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Navegador (Fila Aguardando entrega e diagnósticos)
        if: ${{ github.event.inputs.modo == 'diag-transito' || github.event.inputs.modo == 'diag-transiga' || github.event.inputs.modo == 'diag-senior-js' || startsWith(github.event.inputs.modo || '', 'aguardando') }}
        run: |
          cd robo
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Diagnóstico Trânsito Brasil
        if: ${{ github.event.inputs.modo == 'diag-transito' }}
        run: node robo/diag-transito.mjs
        env:
          ROBO_EMAIL: ${{ secrets.ROBO_EMAIL }}
          ROBO_SENHA: ${{ secrets.ROBO_SENHA }}
      - name: Diagnóstico Transiga
        if: ${{ github.event.inputs.modo == 'diag-transiga' }}
        run: node robo/diag-transiga.mjs
        env:
          ROBO_EMAIL: ${{ secrets.ROBO_EMAIL }}
          ROBO_SENHA: ${{ secrets.ROBO_SENHA }}
          EMAIL_TRANSIGA: ${{ secrets.EMAIL_TRANSIGA }}
          SENHA_TRANSIGA: ${{ secrets.SENHA_TRANSIGA }}
      - name: Diagnóstico front da Senior
        if: ${{ github.event.inputs.modo == 'diag-senior-js' }}
        run: node robo/diag-senior-js.mjs
      - name: Rodar o robô
        if: ${{ github.event.inputs.modo != 'diag-transito' && github.event.inputs.modo != 'diag-transiga' && github.event.inputs.modo != 'diag-senior-js' }}
        run: node robo/robo-ssw.mjs
        env:
          MODO: ${{ github.event.inputs.modo || 'real' }}
          SSW_LIMITE: ${{ github.event.inputs.limite || '' }}
          TRANSP: ${{ github.event.inputs.transp || '' }}
          SSW_PARALELO: ${{ github.event.inputs.paralelo || '' }}
          SSW_PAUSA: ${{ github.event.inputs.pausa || '' }}
          ROBO_EMAIL: ${{ secrets.ROBO_EMAIL }}
          ROBO_SENHA: ${{ secrets.ROBO_SENHA }}
          DOMINALOG_DOMINIO: ${{ secrets.DOMINALOG_DOMINIO }}
          DOMINALOG_USUARIO: ${{ secrets.DOMINALOG_USUARIO }}
          DOMINALOG_SENHA: ${{ secrets.DOMINALOG_SENHA }}
          DOMINALOG_CNPJ: ${{ secrets.DOMINALOG_CNPJ }}
          SSW_SENHA_TRANSSUA: ${{ secrets.SSW_SENHA_TRANSSUA }}
          SSW_SENHA_VM: ${{ secrets.SSW_SENHA_VM }}
          SSW_SENHA_ACEVILLE: ${{ secrets.SSW_SENHA_ACEVILLE }}
          SSW_SENHA_DOMINALOG: ${{ secrets.SSW_SENHA_DOMINALOG }}
          SSW_SENHA_FLOG: ${{ secrets.SSW_SENHA_FLOG || secrets.SSW_SENHA_FLOG_TRANSPORTES || secrets.FLOG_SENHA || secrets.SENHA_FLOG }}
          MULTI360_EMAIL: ${{ secrets.MULTI360_EMAIL }}
          MULTI360_SENHA: ${{ secrets.MULTI360_SENHA }}
          PORTAL_EMAIL: ${{ secrets.PORTAL_EMAIL }}
          PORTAL_SENHA: ${{ secrets.PORTAL_SENHA }}
          JADLOG_TOKEN: ${{ secrets.JADLOG_TOKEN || secrets.TOKEN }}
          JADLOG_USUARIO: ${{ secrets.JADLOG_USUARIO || secrets.USUARIO_JADLOG }}
          JADLOG_CODIGO: ${{ secrets.JADLOG_CODIGO_CLIENTE || secrets.CODIGO_CLIENTE_JADLOG }}
      - name: Continuar a conferência (se ainda falta)
        if: ${{ hashFiles('continuar') != '' }}
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/robo-ssw.yml/dispatches" -d "{\"ref\":\"main\",\"inputs\":{\"modo\":\"${{ github.event.inputs.modo == 'conferencia-tudo' && 'conferencia-tudo' || 'conferencia' }}\"}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
