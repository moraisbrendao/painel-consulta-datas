# Robô da Intelipost (aba "Alterar pedidos" do painel): muda a previsão de entrega dos pedidos da fila.
# Roda quando o painel chama (botão Enviar para o robô) — só roda de verdade
# depois que a variável INTELIPOST_ATIVO = sim existir (Settings > Secrets and variables > Actions > Variables).
# Segredos: INTELIPOST_EMAIL, INTELIPOST_SENHA (login da Intelipost) e ROBO_EMAIL, ROBO_SENHA (login do robô no painel).
# Disparo manual: modo diag (só olha as telas), dryrun (preenche sem salvar) ou real.
name: Robô da Intelipost

on:
  # sem horário fixo (Brenda 23/11): roda quando alguém clica em "Enviar para o robô" no painel (parte 62),
  # na troca de notas e no "manter" (pg_cron)
  workflow_dispatch:
    inputs:
      modo:
        description: "diag = só olhar as telas · diag-troca = olhar as telas da troca de notas · dryrun = preencher sem salvar · real = alterar"
        type: choice
        options: [diag, diag-entregue, entregue-teste, entregue-real, diag-sim, diag-troca, diag-cep, diag-status, diag-ticket, diag-data, dryrun, real, manter]
        default: diag
      ticket:
        description: "Número do ticket (só para diag-data e diag-cep)"
        type: string
        default: ""
      metodo:
        description: "Método de entrega (só para diag-cep)"
        type: string
        default: ""

concurrency:
  group: robo-intelipost${{ github.event.inputs.modo == 'manter' && '-manter' || '' }}   # manter a sessão viva nunca cancela um envio da fila
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # para a rodada chamar a próxima quando a fila for grande

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: github.event_name == 'workflow_dispatch' || vars.INTELIPOST_ATIVO == 'sim'
    env:
      MODO: ${{ github.event.inputs.modo || 'real' }}
      TICKET: ${{ github.event.inputs.ticket || '' }}
      METODO: ${{ github.event.inputs.metodo || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tem pedido na fila?
        id: fila
        run: node robo/tem-intelipost.mjs
        env:
          ROBO_EMAIL: ${{ secrets.ROBO_EMAIL }}
          ROBO_SENHA: ${{ secrets.ROBO_SENHA }}
          GH_TOKEN: ${{ github.token }}

      - name: Preparar o navegador
        if: steps.fila.outputs.tem == 'sim' || startsWith(env.MODO, 'diag') || env.MODO == 'manter'
        working-directory: robo
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb > /dev/null

      - name: Alterar na Intelipost
        if: steps.fila.outputs.tem == 'sim' || startsWith(env.MODO, 'diag') || env.MODO == 'manter'
        run: xvfb-run -a node robo/robo-intelipost.mjs
        env:
          INTELIPOST_EMAIL: ${{ secrets.INTELIPOST_EMAIL }}
          INTELIPOST_SENHA: ${{ secrets.INTELIPOST_SENHA }}
          MULTI360_EMAIL: ${{ secrets.MULTI360_EMAIL }}
          MULTI360_SENHA: ${{ secrets.MULTI360_SENHA }}
          PORTAL_EMAIL: ${{ secrets.PORTAL_EMAIL }}
          PORTAL_SENHA: ${{ secrets.PORTAL_SENHA }}
          ROBO_EMAIL: ${{ secrets.ROBO_EMAIL }}
          ROBO_SENHA: ${{ secrets.ROBO_SENHA }}
          GH_TOKEN: ${{ github.token }}
